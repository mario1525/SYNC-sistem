<header class="topbar">
  <button class="menu-toggle" type="button" aria-label="Abrir menú" (click)="menuAbierto.set(true)">
    <span class="material-icons" aria-hidden="true">menu</span>
  </button>
  <a class="marca" routerLink="/home" aria-label="SYNC, ir al inicio">
    <span class="cuadro" aria-hidden="true"></span>
    <span class="nombre">SYNC</span>
  </a>
  <span class="spacer"></span>
  <a class="reportar" routerLink="/falla/nueva">
    <span class="material-icons" aria-hidden="true">warning_amber</span>
    <span class="texto">Reportar falla</span>
  </a>
  <a class="usuario" routerLink="/perfil" [attr.aria-label]="'Mi perfil: ' + auth.nombre() + ', ' + nombreRol()">
    <span class="datos">
      <span class="nombre">{{ auth.nombre() }}</span>
      <span class="rol">{{ nombreRol() }}</span>
    </span>
    <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
  </a>
</header>

@if (menuAbierto()) {
  <div class="velo" (click)="menuAbierto.set(false)" aria-hidden="true"></div>
}

<aside class="sidebar" [class.abierto]="menuAbierto()" aria-label="Menú principal">
  <div class="sidebar-cab">
    <span class="cuadro" aria-hidden="true"></span>
    <span class="nombre">SYNC</span>
    <button class="cerrar" type="button" aria-label="Cerrar menú" (click)="menuAbierto.set(false)">
      <span class="material-icons" aria-hidden="true">close</span>
    </button>
  </div>
  <nav>
    @for (item of menu(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="activo"
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        class="menu-link"
        (click)="menuAbierto.set(false)"
      >
        <span class="material-icons" aria-hidden="true">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }
  </nav>
  <button class="logout" type="button" (click)="auth.logout()">
    <span class="material-icons" aria-hidden="true">logout</span> Cerrar sesión
  </button>
</aside>

<main class="contenido">
  <router-outlet />
</main>

<nav class="barra-inferior" aria-label="Navegación principal">
  @for (item of inferior(); track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="activo"
      #rlb="routerLinkActive"
      [attr.aria-current]="rlb.isActive ? 'page' : null"
    >
      <span class="material-icons" aria-hidden="true">{{ item.icon }}</span>
      {{ item.label }}
    </a>
  }
  <button type="button" (click)="menuAbierto.set(true)">
    <span class="material-icons" aria-hidden="true">menu</span>
    Más
  </button>
</nav>
